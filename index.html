<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Modern</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">WA PANEL</div>
      <nav>
        <a class="active" data-section="dashboard">Dashboard</a>
        <a data-section="transactions">Transaksi</a>
        <a data-section="wallet">Wallet</a>
        <a data-section="cs">CS Takeover</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Dashboard</h1>
        <button class="logout">Logout</button>
      </header>

      <section class="cards">
        <div class="card blue">
          <span>Pending</span>
          <b id="totalPending">0</b>
        </div>
        <div class="card green">
          <span>ACC</span>
          <b id="totalAcc">0</b>
        </div>
        <div class="card purple">
          <span>Total Transaksi</span>
          <b id="todayTrx">0</b>
        </div>
      </section>

      <section class="table-box">
        <h2>Transaksi Terbaru</h2>
        <input type="text" id="searchInput" placeholder="Search by user or product">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Produk</th>
              <th>Nominal</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="trxList"></tbody>
        </table>
      </section>

      <section class="chart-box">
        <canvas id="chartCanvas"></canvas>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
