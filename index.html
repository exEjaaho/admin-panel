<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel WA Bot</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-container">
  <div class="login-box">
    <h1>Admin Login</h1>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">

  <aside class="sidebar">
    <h2>WA PANEL</h2>
    <a>Dashboard</a>
    <a>Transaksi</a>
    <a>Users</a>
    <a onclick="logout()">Logout</a>
  </aside>

  <main>
    <header>
      <h1>Dashboard</h1>
    </header>

    <section class="cards">
      <div class="card" id="cardPending">Pending<br><span>0</span></div>
      <div class="card" id="cardAcc">ACC<br><span>0</span></div>
      <div class="card" id="cardTotal">Total Transaksi<br><span>0</span></div>
      <div class="card" id="cardRevenue">Revenue<br><span>Rp 0</span></div>
    </section>

    <section class="content">
      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Produk</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="trxList"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
